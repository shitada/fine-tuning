# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: zava-traces-demo
services:
    zava-traces-demo:
        project: src/zava-traces-demo
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        description: 日本語の購入後サポートを再現し、tool-use traceを生成するデモ用Hosted Agent。
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
        name: zava-traces-demo
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments: []
        endpoint: https://stada-2448-resource.services.ai.azure.com/api/projects/stada-2448
infra:
    provider: microsoft.foundry
